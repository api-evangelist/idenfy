name: iDenfy Documentation MCP Server
status: published
description: >-
  iDenfy runs a hosted, remote Model Context Protocol server over the full public documentation
  site. It is read-only and unauthenticated — it serves published documentation pages and the
  OpenAPI specs, and it has no access to dashboards, API keys or verification data. It is a
  DOCUMENTATION server, not a control plane for the verification APIs: nothing in its tool set
  creates a KYC session or reads a verification result.
