tools:
- name: search_i_denfy_documentation
  title: Search documentation
  description: >-
    Search across the iDenfy Documentation knowledge base to find relevant information, code
    examples, API references and guides. Returns contextual content with titles and direct links.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: Search query
    required:
    - query
    additionalProperties: false
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: query_docs_filesystem_i_denfy_documentation
  description: >-
    Run a read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail, jq and friends)
    against a virtualised in-memory filesystem containing ONLY the iDenfy documentation pages and
    OpenAPI specs. Stateless per call; output truncated to 30KB.
  inputSchema:
    type: object
    properties:
      command:
        type: string
        description: A shell command to run against the virtualized documentation filesystem.
    required:
    - command
    additionalProperties: false
- name: submit_feedback
  title: Submit documentation feedback
  description: Report an incorrect, outdated, confusing or incomplete documentation page to the docs team.
  inputSchema:
    type: object
    properties:
      path:
        type: string
      feedback:
        type: string
notes:
- >-
  The server is Mintlify-hosted (x-matched-path /_mintlify/mcp/[subdomain]/[transport], served via
  Vercel) on iDenfy's own documentation.idenfy.com hostname.
- >-
  The published docs page names two tools (search_idenfy_documentation and
  get_page_idenfy_documentation); the live server actually exposes three, and the page-reading tool
  is now query_docs_filesystem_i_denfy_documentation. The tool list recorded above is the live
  tools/list response, not the prose.
- >-
  No MCP server exists for the verification APIs themselves. An agent that needs to create a KYC
  session still calls the REST surface at https://ivs.idenfy.com directly.
