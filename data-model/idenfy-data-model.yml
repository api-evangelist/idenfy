gaps:
- 'Several documented operations are absent from the published specs and therefore absent from this graph as first-class
  operations: KYC deletion (POST /api/v2/delete), the whole Fraud Prevention surface (/fraud/proxy-check, /fraud/validate-phone,
  /fraud/send-sms, /fraud/verify-sms, /fraud/estimate-fraud-probability, /api/v2/address-verification), the Risk
  Assessment surface (/risk/assessment-profiles/, /risk/assessments/), and face-authentication token generation.
  They are real — each has a reference page naming its ivs.idenfy.com endpoint — but iDenfy publishes no OpenAPI
  for them.'
