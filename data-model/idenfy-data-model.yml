source: >-
  Derived from the 414 component schemas and 73 operations across the seven OpenAPI 3.1.0 documents
  iDenfy publishes at https://documentation.idenfy.com/openapi/, cross-read against the product
  guides under https://documentation.idenfy.com/kyc/, /kyb/, /aml/ and /bank-verification/.
provider: iDenfy
providerId: idenfy
note: >-
  iDenfy's model is token-rooted: almost nothing is created directly. A caller mints a session token
  for a product, the human (or the server, for Direct Processing) completes the flow, and the RESULT
  entity comes into existence asynchronously and is announced by webhook. The identifiers a caller
  holds are therefore its own clientId and the server-assigned scanRef / company id / token string.
identifier_scheme:
  style: uuid-and-caller-string
  no_prefixes: true
  note: >-
    No Stripe-style typed prefixes. Identifiers are bare UUIDs or opaque strings, so an id does not
    tell you what it points at.
  identifiers:
  - name: clientId
    owner: caller
    scope: KYC and KYB session creation
    note: >-
      Caller-chosen and must be unique per active session; reusing one returns 409. It is the
      correlation key echoed through every webhook.
  - name: scanRef
    owner: iDenfy
    scope: KYC identification
    example_shape: UUID
    note: The handle for a completed identity verification — retrieval, PDF, blocklist, deletion.
  - name: tokenString
    owner: iDenfy
    scope: KYB form token, face authentication session
    note: Doubles as the kybTokenAuth bearer credential for form-scoped operations.
  - name: companyId / id
    owner: iDenfy
    scope: KYB company and form
  - name: monitoringId
    owner: iDenfy
    scope: AML ongoing monitoring
entities:
