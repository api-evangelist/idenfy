  note: >-
    The KYC result — document data, face match, liveness outcome, status (APPROVED / DENIED /
    SUSPECTED / EXPIRED), fraudTags and mismatchTags.
  relationships:
  - belongs_to: KycToken
    via: clientId
  - has_many: BlocklistEntry
    via: scanRef + blocklistSource
  - has_many: PoaCheck
    via: scanRef
  announced_by:
  - identification
  - identificationAutoFinished
  - identificationManualFinished
  - identificationExpired
  - identificationCancelled
  - identificationResubmitted
- name: BlocklistEntry
