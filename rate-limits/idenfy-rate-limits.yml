specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: iDenfy
providerId: idenfy
created: '2026-05-04'
modified: '2026-09-13'
generated: '2026-09-13'
method: searched
source: https://documentation.idenfy.com/guides/error-handling
note: >-
  REPLACED 2026-09-13. This file previously held a scaffold written by the 2026-05-04 bulk sweep
  (invented 10 rpm / 1,000 per month tiers and a full X-RateLimit-* header set). iDenfy publishes
  none of that.
limit_count: 0
published: false
detail: >-
  iDenfy documents that rate limiting EXISTS and says nothing about its shape. The error-handling
  page lists 429 with the action "Slow down — wait and retry with exponential backoff", and that is
  the entire published surface. No numeric limit, no window, no burst, no per-key or per-account
  scope, and no response headers. A live ripgrep across the whole 84-page documentation corpus
  (through iDenfy's own MCP documentation server) for "rate limit|429|Retry-After" returns the error
  pages and SDK migration guides only — nothing that states a number. None of the seven published
  OpenAPI documents declares a 429 response on any of the 73 operations.
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  documented: false
  note: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header is documented. A client cannot read its
    remaining budget; it discovers exhaustion only by being rejected. For an agent this is the worst
    shape — the runtime signal that would let it pace itself does not exist.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
retry_guidance:
  strategy: exponential backoff
  retryable:
  - 429
  - 500
  - 502
  - 503
  published_example: 1s, 2s, 4s over three attempts
  idempotency_caveat: >-
    The published retry loop retries POSTs with no idempotency mechanism behind it (see
    conventions/idenfy-conventions.yml) — a retried write can create a duplicate billable resource.
  source: https://documentation.idenfy.com/guides/error-handling
commercial_limits:
  note: >-
    The real consumption ceiling is commercial, not technical: the monthly minimum commitment plus
    the overdraft allowance on the plan (Basic $135 / $325 overdraft, Premium $325 / $650 overdraft).
    See plans/idenfy-plans-pricing.yml.
evidence:
