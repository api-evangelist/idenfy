detail: 'iDenfy publishes no dated API changelog. The whole documentation tree — 84 pages across 42 directories
  — contains no changelog, release-notes or "what''s new" page. What exists instead are three migration guides,
  each describing one version transition without dates: an AML v2 -> v3 guide and per-platform SDK migration guides
  for Android and iOS. The Android quickstart even points at the SDK migration guide as "the changelog", which is
  the clearest statement that no separate one exists. Dated release history is therefore only recoverable from the
  GitHub tags of the SDK repositories (see packages/idenfy-packages.yml), not from anything iDenfy publishes as
  a changelog.'
