  breaking: true
  highlights:
  - New screening engine behind AML Monitoring v3.
  - Request body becomes nested — amlCheck.input (who to screen) and amlCheck.filter (what to screen for).
  - 'Person fields: name + surname collapse into amlCheck.input.fullName; type becomes userType.'
  - New status field with new values (ACTIVE/ALERT/STOPPED/PENDING); legacy alertStatus retained alongside it.
  - v2 integrations keep working through a compatibility mapping layer with no announced shutdown date.
