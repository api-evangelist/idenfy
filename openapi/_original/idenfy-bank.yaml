  securitySchemes:
    apiKeyPair:
      type: http
      scheme: basic
      description: |-
        The request must contain basic auth headers where username is *API key* and password is *API secret*.<br>
        In order for you to start using our API you will need an **API key** and **API secret**.<br>
        Both can be retrieved by contacting *iDenfy's support* or *iDenfy's sales team*.
x-tagGroups:
- name: General
  tags:
  - Webhooks
  - Bank
tags:
- name: Bank
  description: Bank verification endpoints.
- name: Webhooks
  description: Webhooks.
externalDocs:
  description: For other/more docs on iDenfy services visit our main documentation
    page.
  url: https://documentation.idenfy.com
webhooks:
  bankVerification:
    post:
      operationId: bankVerification
      description: This notification is sent when a bank verification is completed.
      summary: Bank verification
      externalDocs:
        description: Find info about webhook signing here.
        url: https://documentation.idenfy.com/security/CallbackSigning
      parameters:
      - in: header
        name: Idenfy-Event-Type
        schema:
          type: string
          enum:
          - BANK_VERIFICATION
        required: true
      - in: header
        name: Idenfy-Signature
        schema:
          type: string
        description: Webhook signature
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankVerificationWebhook'
        required: true
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received
            successfully.
  accountCheck:
    post:
      operationId: accountCheck
      description: This notification is sent when an account social media check is completed.
      summary: Account check
      externalDocs:
        description: Find info about webhook signing here.
        url: https://documentation.idenfy.com/security/CallbackSigning
      parameters:
      - in: header
        name: Idenfy-Event-Type
        schema:
          type: string
          enum:
          - ACCOUNT_CHECK
        required: true
      - in: header
        name: Idenfy-Signature
        schema:
          type: string
        description: Webhook signature
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCheckWebhook'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received
            successfully.
