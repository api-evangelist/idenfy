    RelEvent:
      type: object
      description: Serializer for a Regulatory Enforcement List (REL) event.
      properties:
        type:
          type: string
          description: The type of event associated with the list entry.
        currencyCode:
          type: string
          description: For specific event types, there can be associated financial
