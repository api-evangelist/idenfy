          description: The ID of the sanctioning bodies, that imposed the sanction.
            The full list of sanction bodies and their IDs is provided by /dictionaries/sanction-bodies
            endpoint.
        name:
          type: string
          description: The name of the sanction Regime allocated by the sanctioning
            body.
        origin:
