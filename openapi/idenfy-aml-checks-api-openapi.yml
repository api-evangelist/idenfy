openapi: 3.2.0
info:
  title: iDenfy IVS Core AML Checks API
  version: 0.0.0
  description: iDenfy Identity Verification Service's Core API documentation.
  contact:
    name: API Support
    url: https://idenfy-ivs.atlassian.net/servicedesk/customer/portal/1/group/-1
  x-logo:
    url: /static/idenfy_logo.svg
    altText: iDenfy logo
servers:
- url: https://ivs.idenfy.com
tags:
- name: AML Checks
  description: Anti-money laundering check endpoints.
paths:
  /aml/checks/:
    post:
      operationId: amlChecksCreate
      summary: Create AML check
      tags:
      - AML Checks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmlCheckRequest'
      security:
      - apiKeyPair: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCheck'
          description: ''
  /aml/checks/{id}/pdf/:
    post:
      operationId: amlChecksPdfCreate
      summary: Generate AML check PDF
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this AML check.
        required: true
      tags:
      - AML Checks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmlCheckPdfRequest'
      security:
      - apiKeyPair: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /aml/checks/{id}/profiles/{profileId}/:
    get:
      operationId: amlChecksProfilesRetrieve
      summary: Retrieve AML check profile
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this AML check.
        required: true
      - in: path
        name: profileId
        schema:
          type: string
        description: '`resourceId` from AML database search result.'
        required: true
      tags:
      - AML Checks
      security:
      - apiKeyPair: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCheckProfileDetail'
          description: ''
  /aml/checks/{id}/profiles/{profileId}/pdf/:
    post:
      operationId: amlChecksProfilesPdfCreate
      summary: Generate AML check profile PDF
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this AML check.
        required: true
      - in: path
        name: profileId
        schema:
          type: string
        description: '`resourceId` from AML database search result.'
        required: true
      tags:
      - AML Checks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmlCheckPdfRequest'
      security:
      - apiKeyPair: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
components:
  schemas:
    CompanyAmlCheckFilterRequest:
      type: object
      properties:
        threshold:
          type: integer
          maximum: 100
          minimum: 75
          nullable: true
          default: 85
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/CompanyAmlCheckFilterDatasetsEnum'
          description: Required. Specifies which screening datasets to include in the check.
        sanctionBodies:
          type: array
          items:
            type: integer
            maximum: 80
            minimum: 1
          nullable: true
          description: When searching `SAN` dataset, specify the values of sanctioning bodies that should be included when screening `SAN` dataset. The full list of supported sanction bodies and their values are provided by the API info endpoint. If none sanction bodies are provided the system will search sanctions issued by any sanctioning body.
    MonitoringStatusEnum:
      enum:
      - ACTIVE
      - STOPPED
      - PENDING
      - ALERT
      type: string
    ContactEntriesIndividualSchema:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/IndividualContactCategoryEnum'
        value:
          type: string
      required:
      - category
      - value
    CompanyAmlCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clientId:
          type: string
          description: A unique string identifying a client on your side.
          maxLength: 100
        checkedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        userType:
          $ref: '#/components/schemas/UserMonitoringTypeEnum'
        input:
          $ref: '#/components/schemas/CompanyAmlCheckInput'
        filter:
          $ref: '#/components/schemas/CompanyAmlCheckFilter'
        amlCheck:
          type: array
          items:
            $ref: '#/components/schemas/BusinessSearchResult'
          readOnly: true
          nullable: true
          description: AML database search result.
        adverseMedia:
          type: array
          items:
            $ref: '#/components/schemas/AdverseMediaSearchResult'
          readOnly: true
          nullable: true
          description: Adverse media database search result.
        overallStatus:
          allOf:
          - $ref: '#/components/schemas/AmlCheckStatusEnum'
          readOnly: true
        monitoring:
          allOf:
          - $ref: '#/components/schemas/AmlCheckMonitoring'
          readOnly: true
          nullable: true
      required:
      - adverseMedia
      - amlCheck
      - checkedAt
      - clientId
      - created
      - filter
      - id
      - input
      - monitoring
      - overallStatus
      - userType
    CompanyAmlCheckRequest:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
          description: A unique string identifying a client on your side.
          maxLength: 100
        userType:
          $ref: '#/components/schemas/UserMonitoringTypeEnum'
        input:
          $ref: '#/components/schemas/CompanyAmlCheckInputRequest'
        filter:
          $ref: '#/components/schemas/CompanyAmlCheckFilterRequest'
      required:
      - clientId
      - filter
      - input
      - userType
    PepEntries:
      type: object
      description: Serializer for current and former PEP entries.
      properties:
        pepTier:
          allOf:
          - $ref: '#/components/schemas/FullPepTierEnum'
          description: Defines the PEP tier of the individual.
        current:
          type: array
          items:
            $ref: '#/components/schemas/PepSchema'
        former:
          type: array
          items:
            $ref: '#/components/schemas/PepSchema'
      required:
      - current
      - former
    IndividualContactCategoryEnum:
      enum:
      - TELEPHONE
      - FAX
      - MOBILE
      - EMAIL
      type: string
    AmlCheckStatusEnum:
      enum:
      - NOT_CHECKED
      - NO_FLAGS
      - FALSE_POSITIVE
      - TRUE_POSITIVE
      - FLAGS_FOUND
      type: string
    BusinessEvidenceSchema:
      type: object
      properties:
        evidenceId:
          type: string
          description: The unique ID of the evidence.
        originalUrl:
          type: string
          description: The original URL of the evidence source.
        isCopyrighted:
          type: boolean
          default: false
          description: This indicates whether or not the evidence is protected under copyright laws.
        title:
          type: string
          description: The title captured from the article.
        credibility:
          $ref: '#/components/schemas/CredibilityEnum'
        language:
          type: string
          description: The ISO 639-3 code for the language of the evidence.
        summary:
          type: string
          description: For copyrighted evidence, a text snippet from the evidence will be provided.
        keywords:
          type: string
          description: Key words associated with the evidence.
        captureDate:
          type: string
          description: The ISO date that the evidence was captured into the system.
        publicationDate:
          type: string
          description: The ISO date that the evidence was originally published.
        assetUrl:
          type: string
          description: The URL link to the PDF version of the evidence. This is only available for non-copyright sources.
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/BusinessEvidenceDatasetEnum'
          description: "The evidence datasets\n * SAN_CURRENT - Only current Sanctions\n * SAN_FORMER - Only former Sanctions\n * INS - Insolvency\n * RRE - Reputational Risk Exposure\n * POI - Profile Of Interest\n * REL - Regulatory Enforcement List\n * SOE_CURRENT - Only current SOE\n * SOE_FORMER - Only former SOE\n * GRI - Gambling Risk Intelligence\n * ID - Identity\n * CORP - Corporate/Business\n * PEP_CURRENT - (Deprecated - ignore).\n"
      required:
      - datasets
      - evidenceId
      - originalUrl
    PepTierEnum:
      enum:
      - PEP_TIER_1
      - PEP_TIER_2
      - PEP_TIER_3
      type: string
    RreEvent:
      type: object
      description: Serializer for a Reputational Risk Exposure (RRE) event.
      properties:
        type:
          type: string
        date:
          type: string
          description: The ISO date associated with the event.
        evidenceIds:
          type: array
          items:
            type: string
          description: The list of evidence associated with the RRE event.
      required:
      - evidenceIds
      - type
    GriSchema:
      type: object
      description: Serializer for a Gambling Risk Intelligence (GRI) entry.
      properties:
        evidenceId:
          type: string
          description: The ID of supporting evidence.
        title:
          type: string
          description: The title of the GRI report.
        summary:
          type: string
          description: The description of the GRI report.
        keywords:
          type: string
          description: Keywords associated with the report.
      required:
      - evidenceId
      - keywords
      - summary
      - title
    SanEntries:
      type: object
      description: Serializer for current and former sanction entries.
      properties:
        current:
          type: array
          items:
            $ref: '#/components/schemas/SanctionSchema'
        former:
          type: array
          items:
            $ref: '#/components/schemas/SanctionSchema'
      required:
      - current
      - former
    BusinessEvidenceDatasetEnum:
      enum:
      - SAN_CURRENT
      - SAN_FORMER
      - INS
      - RRE
      - POI
      - REL
      - SOE_CURRENT
      - SOE_FORMER
      - GRI
      - ID
      - CORP
      - PEP_CURRENT
      type: string
    IdentifierSchema:
      type: object
      properties:
        category:
          type: string
        value:
          type: string
      required:
      - category
      - value
    PersonAmlCheckInput:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 200
        nationality:
          allOf:
          - $ref: '#/components/schemas/CountryEnum'
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        sex:
          allOf:
          - $ref: '#/components/schemas/MainSexEnum'
          nullable: true
      required:
      - fullName
    IndividualDatasetEnum:
      enum:
      - PEP_CURRENT
      - PEP_FORMER
      - PEP_LINKED
      - SAN_CURRENT
      - SAN_FORMER
      - INS
      - RRE
      - DD
      - POI
      - REL
      - GRI
      type: string
    ContactEntriesBusinessSchema:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/BusinessContactCategoryEnum'
        value:
          type: string
      required:
      - category
      - value
    IndividualEvidenceDatasetEnum:
      enum:
      - PEP_CURRENT
      - PEP_FORMER
      - PEP_LINKED
      - SAN_CURRENT
      - SAN_FORMER
      - INS
      - RRE
      - DD
      - POI
      - REL
      - GRI
      - ID
      - CORP
      type: string
    SanctionSchema:
      type: object
      properties:
        sanctionId:
          type: string
          description: The sanction ID provided by the sanctioning body.
        measures:
          type: array
          items:
            type: string
          description: The list of measures enforced by the sanctioning body.
        regime:
          $ref: '#/components/schemas/SanctionRegime'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SanctionEvent'
      required:
      - events
      - measures
      - regime
    NotesSchema:
      type: object
      properties:
        value:
          type: string
      required:
      - value
    SoeSchemaStatusEnum:
      enum:
      - CURRENT
      - FORMER
      type: string
    SanctionEventTypeEnum:
      enum:
      - ADDED
      - AMENDED
      - REMOVED
      type: string
    AdverseMediaSearchResult:
      type: object
      properties:
        title:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        text:
          type: string
          nullable: true
        score:
          type: integer
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/AmlArticleTypeEnum'
          nullable: true
        publishDate:
          type: string
          format: date
          nullable: true
      required:
      - publishDate
      - score
      - text
      - title
      - type
      - url
    AmlCheckMonitoring:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/MonitoringStatusEnum'
        isSubscribed:
          type: boolean
        expiration:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
            maxLength: 32
            pattern: ^[^,]+$
          default: []
          description: List of case-sensitive strings. Each tag can not be longer than 32 characters.
          maxItems: 5
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
    LinkedIndividualSchema:
      type: object
      properties:
        resourceId:
          type: string
          description: The resource ID can be used to retrieve the full profile or the PDF of the business.
        relationship:
          type: string
          description: Text including names used to describe the relationship with the business.
        ownershipPercentage:
          type: integer
          description: For certain relationship type related to business ownership this value will indicate the percentage ownership when known.
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/IndividualDatasetEnum'
      required:
      - datasets
      - lastName
      - relationship
      - resourceId
    PepAssociationSchema:
      type: object
      description: Serializer for a Politically Exposed Person (PEP) by Association entry, detailing an individual's connection to a PEP.
      properties:
        resourceId:
          type: string
          description: The resource ID to retrieve the profile or PDF of the associated individual.
        evidenceIds:
          type: array
          items:
            type: string
          description: A list of evidence IDs supporting the association.
      required:
      - evidenceIds
      - resourceId
    PoiPosition:
      type: object
      description: Serializer for a position within a Profile of Interest (POI) entry.
      properties:
        position:
          type: string
          description: The name of the political position.
        segment:
          type: string
        country:
          $ref: '#/components/schemas/CountryEnum'
        dateFrom:
          type: string
        dateTo:
          type: string
      required:
      - position
    BusinessContactCategoryEnum:
      enum:
      - TELEPHONE
      - FAX
      - WEBSITE
      type: string
    SearchAddress:
      type: object
      properties:
        geography:
          type: string
          description: An upper-case two-letter ISO-3166-2 code of a country or dependent territory of the profile address or profile nationality.
        city:
          type: string
          description: The city name of the profile address.
      required:
      - geography
    PersonAmlCheckFilterRequest:
      type: object
      properties:
        threshold:
          type: integer
          maximum: 100
          minimum: 75
          nullable: true
          default: 85
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/PersonAmlCheckFilterDatasetsEnum'
          description: Required. Specifies which screening datasets to include in the check.
        sanctionBodies:
          type: array
          items:
            type: integer
            maximum: 80
            minimum: 1
          nullable: true
          description: When searching `SAN` dataset, specify the values of sanctioning bodies that should be included when screening `SAN` dataset. The full list of supported sanction bodies and their values are provided by the API info endpoint. If none sanction bodies are provided the system will search sanctions issued by any sanctioning body.
        dateOfBirthMatching:
          allOf:
          - $ref: '#/components/schemas/DateOfBirthMatchingEnum'
          nullable: true
          default: EXACT
        pepTiers:
          type: array
          items:
            $ref: '#/components/schemas/PepTierEnum'
          nullable: true
    BusinessAliasTypeEnum:
      enum:
      - ORIGINAL_SCRIPT_NAME
      - NAME_SPELLING_VARIATION
      - NAME_ABBREVIATION
      - PREVIOUS_NAME
      - BRAND_NAME
      - FAKE_NAME
      type: string
    CompanyAmlCheckInput:
      type: object
      properties:
        companyName:
          type: string
          maxLength: 200
        country:
          allOf:
          - $ref: '#/components/schemas/CountryEnum'
          nullable: true
      required:
      - companyName
    DdSchema:
      type: object
      description: Serializer for a Disqualified Director (DD) entry.
      properties:
        caseReference:
          type: string
          description: The unique Companies House ID number of the disqualification.
        reason:
          type: string
          description: The reason for the disqualification.
        conduct:
          type: string
          description: The name of the company that the person was acting for.
        dateFrom:
          type: string
          description: Start date of the disqualification.
        dateTo:
          type: string
          description: End date of the disqualification.
        evidenceIds:
          type: array
          items:
            type: string
          description: The list of supporting evidence.
      required:
      - evidenceIds
      - reason
    IndividualAlias:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/IndividualAliasTypeEnum'
          description: This field indicates the type of the alias.
      required:
      - type
    IndividualEvidenceSchema:
      type: object
      properties:
        evidenceId:
          type: string
          description: The unique ID of the evidence.
        originalUrl:
          type: string
          description: The original URL of the evidence source.
        isCopyrighted:
          type: boolean
          default: false
          description: This indicates whether or not the evidence is protected under copyright laws.
        title:
          type: string
          description: The title captured from the article.
        credibility:
          $ref: '#/components/schemas/CredibilityEnum'
        language:
          type: string
          description: The ISO 639-3 code for the language of the evidence.
        summary:
          type: string
          description: For copyrighted evidence, a text snippet from the evidence will be provided.
        keywords:
          type: string
          description: Key words associated with the evidence.
        captureDate:
          type: string
          description: The ISO date that the evidence was captured into the system.
        publicationDate:
          type: string
          description: The ISO date that the evidence was originally published.
        assetUrl:
          type: string
          description: The URL link to the PDF version of the evidence. This is only available for non-copyright sources.
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/IndividualEvidenceDatasetEnum'
          description: "The evidence datasets\n * PEP_CURRENT - Only current PEPs\n * PEP_FORMER - Only former PEPs\n * PEP_LINKED - Only linked PEPs (PEP by Association)\n * SAN_CURRENT - Only current Sanctions\n * SAN_FORMER - Only former Sanctions\n * INS - Insolvency\n * RRE - Reputational Risk Exposure\n * DD - Disqualified Director\n * POI - Profile Of Interest\n * REL - Regulatory Enforcement List\n * GRI - Gambling Risk Intelligence\n * ID - Identity\n * CORP - Corporate/Business.\n"
      required:
      - datasets
      - evidenceId
      - originalUrl
    FullPepTierEnum:
      enum:
      - PEP_TIER_1
      - PEP_TIER_2
      - PEP_TIER_3
      - PEP_BY_ASSOCIATION
      type: string
    UserMonitoringTypeEnum:
      enum:
      - COMPANY
      - PERSON
      type: string
    RelEvent:
      type: object
      description: Serializer for a Regulatory Enforcement List (REL) event.
      properties:
        type:
          type: string
          description: The type of event associated with the list entry.
        currencyCode:
          type: string
          description: For specific event types, there can be associated financial penalties. This field indicates the international currency code.
        amount:
          type: integer
          description: For specific event types, there can be associated financial penalties. This field indicates the monetary amount.
        period:
          allOf:
          - $ref: '#/components/schemas/Period'
          description: Indicates the length of time of the penalty.
        date:
          type: string
          description: The ISO date of the event.
        evidenceIds:
          type: array
          items:
            type: string
          description: The list of evidence associated with the REL event.
      required:
      - evidenceIds
      - type
    IndividualAddressSchema:
      type: object
      properties:
        line1:
          type: string
          description: The first line of the address.
        line2:
          type: string
          description: The second line of the address.
        postcode:
          type: string
          description: The postcode of the address.
        city:
          type: string
          description: The city of the address.
        county:
          type: string
          description: The county of the address.
        countyAbbrev:
          type: string
          description: The abbreviation of the country if appropriate.
        country:
          allOf:
          - $ref: '#/components/schemas/CountryEnum'
          description: The country code of the address.
        addressType:
          allOf:
          - $ref: '#/components/schemas/IndividualAddressTypeEnum'
          description: Indicated the type of address.
      required:
      - addressType
      - country
    CredibilityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      type: string
    PersonAmlCheckFilter:
      type: object
      properties:
        threshold:
          type: integer
          maximum: 100
          minimum: 75
          nullable: true
          default: 85
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/PersonAmlCheckFilterDatasetsEnum'
          description: Required. Specifies which screening datasets to include in the check.
        sanctionBodies:
          type: array
          items:
            type: integer
            maximum: 80
            minimum: 1
          nullable: true
          description: When searching `SAN` dataset, specify the values of sanctioning bodies that should be included when screening `SAN` dataset. The full list of supported sanction bodies and their values are provided by the API info endpoint. If none sanction bodies are provided the system will search sanctions issued by any sanctioning body.
        dateOfBirthMatching:
          allOf:
          - $ref: '#/components/schemas/DateOfBirthMatchingEnum'
          nullable: true
          default: EXACT
        pepTiers:
          type: array
          items:
            $ref: '#/components/schemas/PepTierEnum'
          nullable: true
    IndividualAliasTypeEnum:
      enum:
      - ORIGINAL_SCRIPT_NAME
      - NAME_SPELLING_VARIATION
      - SHORTENED_NAME
      - MAIDEN_NAME
      - NICKNAME
      - PREVIOUS_NAME
      - FAKE_NAME
      type: string
    PoiSchema:
      type: object
      description: Serializer for a Profile of Interest (POI) entry.
      properties:
        category:
          type: string
          description: The category of the Profile of Interest.
        evidenceIds:
          type: array
          items:
            type: string
          description: The list of evidence associated with the POI entry.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PoiPosition'
      required:
      - category
      - evidenceIds
      - positions
    IndividualProfileSchema:
      type: object
      properties:
        version:
          type: integer
          description: The version number can be used by clients to detect when a profile has been changed by our research team.
        resourceId:
          type: string
          description: The resource ID can be used to retrieve the full profile or the PDF of the individual.
        firstName:
          type: string
          description: The first name of the individual.
        middleName:
          type: string
          description: The middle name of the individual.
        lastName:
          type: string
          description: The last name of the individual.
        gender:
          allOf:
          - $ref: '#/components/schemas/MainSexEnum'
          description: The gender of the individual.
        isDeleted:
          type: boolean
          default: false
          description: A true value indicates that the individual has been deleted by our research team.
        deletionReason:
          $ref: '#/components/schemas/DeletionReason'
        isDeceased:
          type: boolean
          default: false
          description: A true value indicates that the individual is deceased.
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/IndividualAlias'
          description: Defines a list of aliases for the individual.
        datesOfBirth:
          type: array
          items:
            type: string
          description: The list of birth dates for the individual.
        datesOfDeath:
          type: array
          items:
            type: string
          description: The list of death dates for the individual.
        nationalities:
          type: array
          items:
            $ref: '#/components/schemas/CountryEnum'
          description: List of the individual's nationalities.
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/IndividualAddressSchema'
          description: The list of the individual's addresses.
        profileImages:
          type: array
          items:
            type: string
