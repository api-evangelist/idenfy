openapi: 3.1.0
info:
  title: iDenfy Aml Face Authentication API
  description: 'iDenfy identity verification, business verification (KYB), AML screening,

    face authentication, bank verification, and fraud prevention REST API.

    '
  version: '2.0'
  contact:
    name: iDenfy Support
    url: https://documentation.idenfy.com/
servers:
- url: https://ivs.idenfy.com
  description: Production
security:
- basicAuth: []
tags:
- name: Face Authentication
paths:
  /face-authentication/sessions:
    post:
      summary: Create face authentication session
      operationId: createFaceAuthSession
      responses:
        '200':
          description: Session created
      tags:
      - Face Authentication
  /face-authentication/sessions/{sessionId}:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Retrieve face authentication session info
      operationId: getFaceAuthSession
      responses:
        '200':
          description: Session details
      tags:
      - Face Authentication
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using API_KEY as username and API_SECRET as password.
