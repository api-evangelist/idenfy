note: >-
  REPLACED 2026-09-13. This file previously held a scaffold written by the 2026-05-04 bulk sweep
  (a fictional "Free" tier with a 1,000 requests/month quota and a 10 rpm rate limit). None of that
  was iDenfy's. The figures below are iDenfy's own published pay-as-you-go terms.
pricing_model: >-
  Per-approved-verification consumption against a monthly minimum commitment. iDenfy bills only for
  APPROVED verifications — denied attempts are not charged (stated in https://idenfy.com/llms.txt).
  Unit prices per verification type are not published; the published numbers are the monthly
  commitment and the overdraft ceiling.
plan_count: 3
currency: USD
free_trial:
  available: true
  duration_days: 14
  or_quota: 10
  quota_unit: KYC verifications
  terms: >-
    14 days or 10 KYC verifications, whichever comes first. The account converts to a paid monthly
    plan afterwards unless cancelled beforehand.
plans:
- id: idenfy-basic
  name: Basic
  type: pay-as-you-go
  billing_period: month
  description: >-
    Pay-as-you-go monthly plan. The minimum monthly commitment is billed like a subscription even if
    the verifications are not used, and unused verifications do not roll over.
  monthly_minimum_commitment:
    amount: '135.00'
    currency: USD
  overage:
    model: overdraft-on-credit
    ceiling:
      amount: '325.00'
      currency: USD
    billing: Overdraft usage is billed with the next monthly payment.
  rollover: false
  cancellation: Cancel anytime.
- id: idenfy-premium
  name: Premium
  type: pay-as-you-go
  billing_period: month
  description: Higher-commitment pay-as-you-go monthly plan with a larger overdraft allowance.
  monthly_minimum_commitment:
    amount: '325.00'
    currency: USD
  overage:
    model: overdraft-on-credit
    ceiling:
      amount: '650.00'
      currency: USD
    billing: Overdraft usage is billed with the next monthly payment.
  rollover: false
  cancellation: Cancel anytime.
- id: idenfy-enterprise
  name: Enterprise
  type: contract
  billing_period: year
  price: null
  description: >-
    Custom yearly contract with volume-based discounts and a custom quote. No prices are published;
    this tier is sales-gated.
  docs: https://documentation.idenfy.com/resources/billing/enterprise
signup:
  url: https://idenfy.com/pricing-plans-v4/
