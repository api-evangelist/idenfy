apis:
- aid: idenfy:idenfy-kyc-api
  name: iDenfy Identity Verification (KYC) API
  description: Document verification, selfie capture, liveness detection and AI plus human review. Mint
    a session token with POST /api/v2/token, hand the returned authToken to a redirect, iFrame or mobile
    SDK, and receive the result as a signed webhook. Also covers blocklisting, proof-of-address checks
    and requesting additional information from a client.
  humanURL: https://documentation.idenfy.com/kyc/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - Identity Verification
  - KYC
  - Liveness
  - Biometrics
  - Document Verification
  properties:
  - type: OpenAPI
    url: openapi/idenfy-kyc-openapi.yml
  - type: Overlay
    url: overlays/idenfy-kyc-overlay.yaml
  - type: Documentation
    url: https://documentation.idenfy.com/kyc/overview
  - type: APIReference
    url: https://documentation.idenfy.com/api-reference/overview
- aid: idenfy:idenfy-kyb-api
  name: iDenfy Business Verification (KYB) API
  description: Company verification across 180+ registries with ultimate beneficial owner identification,
    KYB form collection, beneficiary and document management, questionnaires, credit bureau reports, government
    document orders, US Secretary of State filings and registry centre checks. The largest of the published
    contracts at 49 operations and 8 webhook events.
  humanURL: https://documentation.idenfy.com/kyb/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - Business Verification
  - KYB
  - UBO
  - Compliance
  - Registry
  properties:
  - type: OpenAPI
    url: openapi/idenfy-kyb-openapi.yml
  - type: Overlay
    url: overlays/idenfy-kyb-overlay.yaml
  - type: Documentation
    url: https://documentation.idenfy.com/kyb/overview
- aid: idenfy:idenfy-aml-api
  name: iDenfy AML Screening and Monitoring API
  description: 'Screens people and companies against sanctions lists, politically exposed persons and
    adverse media, as a one-time check or as ongoing monitoring that raises an alert when a new match
    appears. Carries two generations at once: v3 status values alongside the legacy v2 alertStatus in
    every webhook payload.'
  humanURL: https://documentation.idenfy.com/aml/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - AML
  - Compliance
  - PEP
  - Sanctions
  - Adverse Media
  properties:
