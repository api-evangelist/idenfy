  - type: Documentation
    url: https://documentation.idenfy.com/bank-card/create-session
- aid: idenfy:idenfy-face-authentication-api
  name: iDenfy Face Authentication API
  description: Re-authenticates a returning user in about thirty seconds by matching a live facial scan
    against a previously verified identity. The published contract exposes the session list and retrieve
    operations; token generation is documented separately and is not in the OpenAPI.
  humanURL: https://documentation.idenfy.com/face-authentication/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - Face Authentication
  - Biometrics
  - Identity Verification
  properties:
  - type: OpenAPI
    url: openapi/idenfy-face-authentication-openapi.yml
  - type: Overlay
    url: overlays/idenfy-face-authentication-overlay.yaml
  - type: Documentation
    url: https://documentation.idenfy.com/face-authentication/overview
- aid: idenfy:idenfy-age-estimation-api
  name: iDenfy Age Estimation API
  description: Estimates age from a selfie and escalates borderline cases to a full document check on
    the same integration, giving one audit trail from selfie to certified ID. Account balance is pre-checked
    and an insufficient balance returns 402.
  humanURL: https://documentation.idenfy.com/age-estimation/create-session
  baseURL: https://ivs.idenfy.com
  tags:
  - Age Verification
