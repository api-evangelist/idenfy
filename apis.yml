  - type: Documentation
    url: https://documentation.idenfy.com/age-estimation/create-session
- aid: idenfy:idenfy-fraud-api
  name: iDenfy Fraud Prevention and Risk API
  description: AI risk scoring, proxy/VPN/Tor detection, phone validation, SMS phone verification, fraud
    probability estimation, address verification and AI proof of address, plus configurable risk assessment
    profiles. Every endpoint is documented with its ivs.idenfy.com path, but iDenfy publishes NO OpenAPI
    for this surface - it is the one product family with a reference page and no machine-readable contract.
  humanURL: https://documentation.idenfy.com/fraud-prevention/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - Fraud Detection
  - Risk Scoring
  - Proxy Detection
  - Phone Verification
  - Address Verification
  properties:
