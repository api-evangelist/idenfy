apis:
- aid: idenfy:idenfy-fraud-api
  name: iDenfy Fraud Prevention and Risk API
  description: >-
    AI risk scoring, proxy/VPN/Tor detection, phone validation, SMS phone verification, fraud probability
    estimation, address verification and AI proof of address, plus configurable risk assessment profiles.
    Every endpoint is documented with its ivs.idenfy.com path, but iDenfy publishes NO OpenAPI for this
    surface - it is the one product family with a reference page and no machine-readable contract.
  humanURL: https://documentation.idenfy.com/fraud-prevention/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - Fraud Detection
  - Risk Scoring
  - Proxy Detection
  - Phone Verification
  - Address Verification
  properties:
  - type: Documentation
    url: https://documentation.idenfy.com/fraud-prevention/overview
  - type: APIReference
    url: https://documentation.idenfy.com/fraud-prevention/risk-assessment
- aid: idenfy:idenfy-docs-mcp
  name: iDenfy Documentation MCP Server
  description: >-
    A hosted, unauthenticated remote Model Context Protocol server over the whole public documentation
    site, including the seven OpenAPI specs. Three live tools: documentation search, a read-only virtual
    filesystem for reading pages and specs, and documentation feedback submission. Read-only by design
    - it reaches no dashboard, key or verification data, and cannot call the verification APIs.
  humanURL: https://documentation.idenfy.com/resources/mcp
  baseURL: https://documentation.idenfy.com/mcp
  tags:
  - MCP
  - Documentation
  - Agents
  tags_raw:
  - MCP
