  - type: Documentation
    url: https://documentation.idenfy.com/aml/overview
- aid: idenfy:idenfy-bank-api
  name: iDenfy Bank Verification API
  description: Verifies bank account ownership through open banking connections to European banks, and
    exposes the account transaction list behind a completed verification. Two operations and two webhook
    events.
  humanURL: https://documentation.idenfy.com/bank-verification/overview
  baseURL: https://ivs.idenfy.com
  tags:
  - Bank Verification
  - Open Banking
  - Account Verification
  properties:
  - type: OpenAPI
    url: openapi/idenfy-bank-openapi.yml
  - type: Overlay
    url: overlays/idenfy-bank-overlay.yaml
  - type: Documentation
    url: https://documentation.idenfy.com/bank-verification/overview
- aid: idenfy:idenfy-bank-card-api
  name: iDenfy Bank Card Verification API
  description: Creates a standalone bank card verification session. Account balance is pre-checked, and
    an insufficient balance is rejected with 402 rather than 403. One operation and one webhook event.
  humanURL: https://documentation.idenfy.com/bank-card/create-session
  baseURL: https://ivs.idenfy.com
  tags:
  - Bank Card
  - Card Verification
  - Fraud Detection
  properties:
