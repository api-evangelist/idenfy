    url: https://documentation.idenfy.com/fraud-prevention/overview
  - type: APIReference
    url: https://documentation.idenfy.com/fraud-prevention/risk-assessment
- aid: idenfy:idenfy-docs-mcp
  name: iDenfy Documentation MCP Server
  description: 'A hosted, unauthenticated remote Model Context Protocol server over the whole public documentation
    site, including the seven OpenAPI specs. Three live tools: documentation search, a read-only virtual
    filesystem for reading pages and specs, and documentation feedback submission. Read-only by design
    - it reaches no dashboard, key or verification data, and cannot call the verification APIs.'
  humanURL: https://documentation.idenfy.com/resources/mcp
  baseURL: https://documentation.idenfy.com/mcp
