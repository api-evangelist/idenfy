description: iDenfy is an identity verification platform providing KYC, KYB, and AML compliance solutions.
  The iDenfy API enables businesses to verify identities, check for fraud, and comply with regulatory
  requirements through automated document verification, facial recognition, AML screening, business verification,
  and bank verification services.
