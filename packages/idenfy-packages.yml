note: >-
  iDenfy distributes client-side verification SDKs, not API client libraries. There is no official
  server-side SDK for the REST surface in any language — the authentication page shows raw cURL,
  Python requests, Node fetch and PHP curl examples instead. The Android and iOS SDKs are the
  first-party core; React Native, Flutter and Cordova wrap them. Cordova, Magento and WordPress are
  materially behind the mobile core and are recorded with their real dates for that reason.
