domain_standards:
  note: >-
    REWARD-ONLY and honestly empty at the contract level. iDenfy sits in identity verification /
    RegTech, which has no single machine-readable interchange standard of the kind
    domain_standard_conformance rewards (no SCIM URN, no OData $metadata, no HL7/X12/ISO-20022
    message type, no OpenRTB or LTI shape). The regimes iDenfy operates under — AMLD5/AMLD6, eIDAS,
    FATF, GDPR, PSD2 — are legal obligations it satisfies, not wire formats its contract speaks, and
    nothing in the seven specs declares an identifier for any of them. The only standards
    identifiers actually present in the contract are ISO 3166-1/3166-2 country codes and MRZ
    (ICAO 9303 machine-readable-zone) field names in the KYC document schemas. Claiming a domain
    standard here would be inventing one.
  contract_signals:
  - signal: MRZ fields in KYC document schemas
    standard_hint: ICAO Doc 9303 machine-readable travel documents
    conforms: null
    evidence: >-
      kyc.yaml and kyb.yaml schemas expose Mrz/MRZ field names. The specs do not cite ICAO 9303, so
      this is recorded as a signal, not an asserted conformance.
  - signal: AmlD field names
    standard_hint: EU Anti-Money Laundering Directives
    conforms: null
    evidence: >-
      Eight AmlD-prefixed identifiers in aml.yaml/kyb.yaml. A naming echo of the regime, not a
      declared conformance.
compliance_programs:
  note: >-
    Published certifications and regimes live in security/idenfy-trust-center.yml — ISO/IEC 27001:2022
    (certified since 2020), SOC 2 Type II, eIDAS, and compliance with GDPR, CCPA, AMLD5/6, PSD2 and
    FATF, per https://idenfy.com/llms.txt (200).
